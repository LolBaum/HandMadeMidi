# presets.yaml

- name: "Off"
  features: {}
  note_config: null
  pitch_bend: null
  deadband: 0.01
  mirror_left_hand: false
  apply_channel_offset: true

- name: "Pitch/Roll"
  features:
    hand_pitch:
      midi: [1, 20]
      norm_range: [-70, 50]
      filter: [0.5, 0.2]
    hand_roll:
      midi: [1, 21]
      norm_range: [-100, 180]
      filter: [0.5, 0.2]
  note_config: null
  pitch_bend: null
  deadband: 0.01
  mirror_left_hand: true
  apply_channel_offset: true

- name: "Position"
  features:
    palm_x:
      midi: [2, 22]
      norm_range: [0.1, 0.9]
      filter: [0.3, 0.1]
    palm_y:
      midi: [2, 23]
      norm_range: [0.1, 0.9]
      filter: [0.3, 0.1]
  note_config: null
  pitch_bend: null
  deadband: 0.015
  mirror_left_hand: false
  apply_channel_offset: true

- name: "Finger Spread"
  features:
    thumb_index_dist:
      midi: [3, 30]
      norm_range: [0.0, 1.2]
      filter: [0.4, 0.15]
  note_config: null
  pitch_bend: null
  deadband: 0.01
  mirror_left_hand: true
  apply_channel_offset: true

- name: "Fist"
  features:
    fist:
      midi: [4, 40]
      norm_range: [0.0, 1.0]
      filter: [0.3, 0.1]
  note_config: null
  pitch_bend: null
  deadband: 0.01
  mirror_left_hand: true
  apply_channel_offset: true

- name: "Multi"
  features:
    hand_scale:
      midi: [1, 1]
      norm_range: [0.1, 0.4]
      filter: [0.3, 0.1]
    hand_pitch:
      midi: [1, 20]
      norm_range: [-20, 20]
      filter: [0.01, 0.01]
    hand_roll:
      midi: [1, 21]
      norm_range: [-90, 90]
      filter: [0.01, 0.01]
    palm_x:
      midi: [2, 22]
      norm_range: [0.2, 0.8]
      filter: [0.3, 0.1]
    palm_y:
      midi: [2, 23]
      norm_range: [0.2, 0.8]
      filter: [0.3, 0.1]
    thumb_index_dist:
      midi: [2, 24]
      norm_range: [0.15, 1.4]
      filter: [0.5, 0.5]
    fist:
      midi: [4, 40]
      norm_range: [0.05, 0.7]
      filter: [0.3, 0.1]
  note_config: null
  pitch_bend: null
  deadband: 0.015
  mirror_left_hand: false
  apply_channel_offset: true

- name: "Note Gen"
  features:
    hand_scale:
      midi: [1, 1]
      norm_range: [0.1, 0.25]
      filter: [0.2, 0.05]
    hand_pitch:
      midi: [1, 20]
      norm_range: [-20, 20]
      filter: [0.01, 0.01]
    hand_roll:
      midi: [1, 21]
      norm_range: [-90, 90]
      filter: [0.01, 0.01]
    palm_x:
      midi: [2, 22]
      norm_range: [0.2, 0.8]
      filter: [0.3, 0.1]
    palm_y:
      midi: [2, 23]
      norm_range: [0.2, 0.8]
      filter: [0.3, 0.1]
    thumb_index_dist:
      midi: [2, 24]
      norm_range: [0.0, 0.4]
      filter: [0.5, 0.5]
    fist:
      midi: [4, 40]
      norm_range: [0.05, 0.7]
      filter: [0.3, 0.1]
  note_config:
    channel: 1
    note_min: 12
    note_max: 103
    threshold: 0.5
    timeout: 20.0
    note_source: "palm_y"
    gate_source: "thumb_index_dist"
  pitch_bend:
    source: "palm_x"
    channel: 1
    deadband: 0.0005
    invert: false
  deadband: 0.015
  mirror_left_hand: false
  apply_channel_offset: true

# ---------------------------------------------------------------------
# Theremin presets.  Both target channel 1 with apply_channel_offset: false
# so that left and right hands share the same MIDI channel and control the
# SAME instrument.  Assign one preset to each hand for a classic theremin.
# ---------------------------------------------------------------------
- name: "Theremin Volume"
  features:
    palm_y:
      midi: [1, 11]              # CC 11 (Expression) — raise hand = louder
      norm_range: [0.3, 0.8]
      filter: [0.5, 0.2]
  note_config: null
  pitch_bend: null
  deadband: 0.005
  mirror_left_hand: true
  apply_channel_offset: false

- name: "Theremin Pitch"
  features:
    palm_y:
      midi: null                 # Not sent as CC — only drives pitch bend
      norm_range: [0.3, 0.8]
      filter: [0.5, 0.2]
  note_config: null
  pitch_bend:
    source: "palm_y"
    channel: 1
    deadband: 0.0005
    invert: false
  deadband: 0.005
  mirror_left_hand: true
  apply_channel_offset: false